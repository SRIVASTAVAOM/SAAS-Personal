<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SAMAGRA - The Complete School Platform (Mobile Suite for Students, Teachers & Parents)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SAMAGRA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">

  <!-- Favicons with cache-busting -->
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=3"/>
  <link rel="shortcut icon" href="favicon.ico?v=3"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=3"/>

  <title>SAMAGRA - The Complete School Platform</title>
  <link rel="manifest" href="manifest.json?v=3">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #EEF2FF 0%, #FFFFFF 50%, #F8FAFC 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out, visibility 0.4s;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .splash-logo-box {
      width: 96px;
      height: 96px;
      background: #FFFFFF;
      border-radius: 24px;
      border: 1.5px solid #E2E8F0;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: float 2.5s ease-in-out infinite;
    }
    .splash-logo-box img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .splash-title {
      font-size: 28px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.5px;
      margin: 0 0 6px 0;
    }
    .splash-tagline {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #4338CA;
      background: #EEF2FF;
      border: 1px solid #C7D2FE;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin: 0 0 28px 0;
    }
    .splash-loader-bar {
      width: 140px;
      height: 3.5px;
      background: #E2E8F0;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .splash-loader-bar::after {
      content: '';
      position: absolute;
      left: -50%;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #4F46E5, #38BDF8);
      border-radius: 4px;
      animation: load 1.2s infinite ease-in-out;
    }
    @keyframes load {
      0% { left: -50%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div class="splash-card">
      <div class="splash-logo-box">
        <img src="icons/Icon-192.png?v=3" alt="SAMAGRA" />
      </div>
      <div class="splash-title">SAMAGRA</div>
      <div class="splash-tagline">The Complete School Platform</div>
      <div class="splash-loader-bar"></div>
    </div>
  </div>

  <script>
    function removeSplashScreen() {
      var splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(function() {
          splash.remove();
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', removeSplashScreen);
    setTimeout(removeSplashScreen, 7000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
